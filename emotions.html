<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Emotion Wheel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth fade transitions */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white max-w-2xl w-full rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-teal-600 p-6 text-white text-center relative">
            <h1 class="text-2xl font-bold tracking-tight">The Feelings Wheel</h1>
            <p class="text-teal-100 text-sm mt-1">Name it to tame it. Click the closest feeling to dig deeper.</p>
        </div>

        <!-- Breadcrumb Navigation -->
        <div class="bg-slate-100 border-b border-slate-200 px-6 py-3 flex items-center text-sm font-medium text-slate-500 h-12" id="breadcrumb-container">
            <span id="bc-core" class="cursor-pointer hover:text-teal-600 transition-colors hidden" onclick="resetToCore()">Home</span>
            <span id="bc-sep-1" class="mx-2 hidden">/</span>
            <span id="bc-secondary" class="cursor-pointer hover:text-teal-600 transition-colors hidden" onclick="goBackToSecondary()"></span>
            <span id="bc-sep-2" class="mx-2 hidden">/</span>
            <span id="bc-tertiary" class="text-slate-800 hidden"></span>
        </div>

        <!-- Dynamic Content Area -->
        <div class="p-6 md:p-8 min-h-[350px] flex flex-col justify-center" id="app-container">
            <!-- Buttons and Results will be injected here by JavaScript -->
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 p-4 border-t border-slate-200 flex justify-center">
            <button id="btn-restart" class="text-slate-500 hover:text-teal-600 font-medium text-sm transition-colors" onclick="resetToCore()">
                ↺ Start Over
            </button>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Emotion Data Structure based on the Plutchik/Gloria Willcox emotion wheel concepts
        const emotionData = {
            "Sad": {
                color: "bg-blue-500 hover:bg-blue-600 ring-blue-200",
                textColor: "text-blue-800 bg-blue-100",
                sub: {
                    "Lonely": ["Isolated", "Abandoned", "Left Out"],
                    "Vulnerable": ["Fragile", "Victimized", "Insecure"],
                    "Despair": ["Grief", "Powerless", "Hopeless"],
                    "Depressed": ["Empty", "Heavy", "Apathetic"],
                    "Disappointed": ["Let down", "Dismayed", "Disillusioned"]
                }
            },
            "Anxious / Scared": {
                color: "bg-purple-500 hover:bg-purple-600 ring-purple-200",
                textColor: "text-purple-800 bg-purple-100",
                sub: {
                    "Overwhelmed": ["Racing thoughts", "Stressed", "Frantic"],
                    "Insecure": ["Inadequate", "Inferior", "Imposter"],
                    "Anxious": ["Worried", "Dreading", "Nervous"],
                    "Terrified": ["Panicked", "Trapped", "Frozen"]
                }
            },
            "Angry / Frustrated": {
                color: "bg-red-500 hover:bg-red-600 ring-red-200",
                textColor: "text-red-800 bg-red-100",
                sub: {
                    "Agitated": ["Annoyed", "Irritated", "Restless"],
                    "Threatened": ["Jealous", "Defensive", "Insecure"],
                    "Mad": ["Furious", "Enraged", "Boiling"],
                    "Betrayed": ["Resentful", "Cheated", "Deceived"]
                }
            },
            "Tired / Burned Out": {
                color: "bg-slate-500 hover:bg-slate-600 ring-slate-200",
                textColor: "text-slate-800 bg-slate-200",
                sub: {
                    "Exhausted": ["Drained", "Fatigued", "Sapped"],
                    "Disconnected": ["Numb", "Detached", "Foggy"],
                    "Unmotivated": ["Bored", "Sluggish", "Stuck"]
                }
            },
            "Peaceful / Okay": {
                color: "bg-emerald-500 hover:bg-emerald-600 ring-emerald-200",
                textColor: "text-emerald-800 bg-emerald-100",
                sub: {
                    "Relaxed": ["Calm", "Serene", "Tranquil"],
                    "Content": ["Satisfied", "Safe", "Grounded"],
                    "Relieved": ["Unburdened", "Lighter", "Clear"]
                }
            }
        };

        // State variables
        let selectedCore = null;
        let selectedSecondary = null;

        const container = document.getElementById('app-container');

        // Breadcrumb Elements
        const bcCore = document.getElementById('bc-core');
        const bcSep1 = document.getElementById('bc-sep-1');
        const bcSecondary = document.getElementById('bc-secondary');
        const bcSep2 = document.getElementById('bc-sep-2');
        const bcTertiary = document.getElementById('bc-tertiary');

        function updateBreadcrumbs(level, text = "") {
            if (level === 0) {
                bcCore.classList.add('hidden');
                bcSep1.classList.add('hidden');
                bcSecondary.classList.add('hidden');
                bcSep2.classList.add('hidden');
                bcTertiary.classList.add('hidden');
            } else if (level === 1) {
                bcCore.innerText = text;
                bcCore.classList.remove('hidden');
                bcSep1.classList.add('hidden');
                bcSecondary.classList.add('hidden');
                bcSep2.classList.add('hidden');
                bcTertiary.classList.add('hidden');
            } else if (level === 2) {
                bcSecondary.innerText = text;
                bcSep1.classList.remove('hidden');
                bcSecondary.classList.remove('hidden');
                bcSep2.classList.add('hidden');
                bcTertiary.classList.add('hidden');
            } else if (level === 3) {
                bcTertiary.innerText = text;
                bcSep2.classList.remove('hidden');
                bcTertiary.classList.remove('hidden');
            }
        }

        function renderGrid(items, onClickHandler, colorClasses = "bg-teal-500 hover:bg-teal-600 ring-teal-200") {
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 fade-in w-full";
            
            items.forEach(item => {
                const btn = document.createElement('button');
                // Use custom colors if navigating the core, otherwise use the parent core's color
                let btnColor = typeof item.color !== 'undefined' ? item.color : colorClasses;
                
                btn.className = `${btnColor} text-white font-medium py-4 px-3 rounded-xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all focus:ring-4 focus:outline-none text-center h-full flex items-center justify-center text-sm md:text-base`;
                btn.innerText = item.label;
                btn.onclick = () => onClickHandler(item.label);
                grid.appendChild(btn);
            });
            
            container.appendChild(grid);
        }

        function showCoreEmotions() {
            selectedCore = null;
            selectedSecondary = null;
            updateBreadcrumbs(0);
            
            const prompt = document.createElement('h2');
            prompt.className = "text-xl font-bold text-slate-800 mb-6 text-center fade-in";
            prompt.innerText = "Right now, what is the loudest feeling?";
            
            container.innerHTML = '';
            container.appendChild(prompt);

            const items = Object.keys(emotionData).map(key => ({
                label: key,
                color: emotionData[key].color
            }));

            const gridContainer = document.createElement('div');
            gridContainer.className = "w-full";
            container.appendChild(gridContainer);
            
            // Render grid manually to append to the specific wrapper
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-3 fade-in w-full max-w-lg mx-auto";
            
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `${item.color} text-white font-medium py-4 px-4 rounded-xl shadow-sm hover:shadow-md transition-all focus:ring-4 focus:outline-none text-center`;
                btn.innerText = item.label;
                btn.onclick = () => showSecondaryEmotions(item.label);
                grid.appendChild(btn);
            });
            
            gridContainer.appendChild(grid);
        }

        function showSecondaryEmotions(core) {
            selectedCore = core;
            updateBreadcrumbs(1, core);
            
            const prompt = document.createElement('h2');
            prompt.className = "text-lg font-semibold text-slate-800 mb-6 text-center fade-in";
            prompt.innerText = `You selected "${core}". Which of these feels most accurate?`;
            
            container.innerHTML = '';
            container.appendChild(prompt);

            const subKeys = Object.keys(emotionData[core].sub);
            const items = subKeys.map(key => ({ label: key }));
            
            const gridContainer = document.createElement('div');
            gridContainer.className = "w-full";
            container.appendChild(gridContainer);
            
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-2 md:grid-cols-3 gap-3 fade-in";
            
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `${emotionData[core].color} text-white font-medium py-3 px-3 rounded-xl shadow-sm hover:shadow-md transition-all text-sm`;
                btn.innerText = item.label;
                btn.onclick = () => showTertiaryEmotions(item.label);
                grid.appendChild(btn);
            });
            gridContainer.appendChild(grid);
        }

        function showTertiaryEmotions(secondary) {
            selectedSecondary = secondary;
            updateBreadcrumbs(2, secondary);
            
            const prompt = document.createElement('h2');
            prompt.className = "text-lg font-semibold text-slate-800 mb-6 text-center fade-in";
            prompt.innerText = `Drilling down into "${secondary}". Can you get even more specific?`;
            
            container.innerHTML = '';
            container.appendChild(prompt);

            const tertiaryList = emotionData[selectedCore].sub[secondary];
            const items = tertiaryList.map(item => ({ label: item }));
            
            const gridContainer = document.createElement('div');
            gridContainer.className = "w-full";
            container.appendChild(gridContainer);
            
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-2 md:grid-cols-3 gap-3 fade-in";
            
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `${emotionData[selectedCore].color} text-white font-medium py-3 px-3 rounded-xl shadow-sm hover:shadow-md transition-all text-sm`;
                btn.innerText = item.label;
                btn.onclick = () => showResult(item.label);
                grid.appendChild(btn);
            });
            gridContainer.appendChild(grid);
        }

        function showResult(tertiary) {
            updateBreadcrumbs(3, tertiary);
            container.innerHTML = '';
            
            const resultBox = document.createElement('div');
            resultBox.className = "text-center fade-in max-w-md mx-auto";
            
            const badgeColor = emotionData[selectedCore].textColor;

            resultBox.innerHTML = `
                <div class="mb-4">
                    <span class="inline-block px-4 py-1.5 rounded-full text-sm font-bold tracking-wide uppercase ${badgeColor}">
                        Identified Feeling
                    </span>
                </div>
                <h2 class="text-4xl font-black text-slate-800 mb-4 capitalize">${tertiary}</h2>
                <p class="text-slate-600 mb-6 leading-relaxed">
                    By putting a specific name to how you feel, you've moved this emotion from the emotional center of your brain to the logical center. 
                    <strong>You are experiencing a feeling of being ${tertiary.toLowerCase()}, but you are not defined by it.</strong>
                </p>
                
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 text-left mb-6">
                    <h3 class="font-bold text-slate-800 mb-2">What to do now:</h3>
                    <ul class="text-sm text-slate-600 space-y-2 list-disc list-inside">
                        <li>Acknowledge it: "It makes sense that I feel ${tertiary.toLowerCase()} right now."</li>
                        <li>Sit with it without trying to aggressively "fix" it immediately.</li>
                        <li>Ask yourself: What is one small, gentle thing I can do to take care of myself in this specific moment?</li>
                    </ul>
                </div>
            `;
            
            container.appendChild(resultBox);
        }

        // Navigation helpers
        function resetToCore() {
            showCoreEmotions();
        }

        function goBackToSecondary() {
            if (selectedCore) {
                showSecondaryEmotions(selectedCore);
            }
        }

        // Initialize the app
        window.onload = resetToCore;
    </script>
</body>
</html>
